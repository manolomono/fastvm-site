# Landing de Fast VM en el nginx del host: fastvm.isasa.es → contenedor en 127.0.0.1:9113.
# Instalación (una vez, con sudo):
#   sudo cp ~/fastvm-site/deploy/fastvm.isasa.es.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/fastvm.isasa.es.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fastvm.isasa.es    # añade el bloque 443 y la redirección

server {
    listen 80;
    listen [::]:80;
    server_name fastvm.isasa.es;

    location / {
        proxy_pass http://127.0.0.1:9113;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
